[project]
name = "multi-agent-codegen"
version = "0.1.0"
description = "Planner / Coder / Reviewer code generation with a local model, measured against single-shot generation on HumanEval"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
mac = "mac.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "mac"
